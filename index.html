<script id="engine">
// ENGINE START
// p[i] >0 white count, <0 black count. White moves 23->0 (home 0-5), black 0->23 (home 18-23).
const OFF='off';
function newGame(){const p=Array(24).fill(0);p[23]=2;p[12]=5;p[7]=3;p[5]=5;p[0]=-2;p[11]=-5;p[16]=-3;p[18]=-5;return{p,bar:{w:0,b:0},off:{w:0,b:0}}}
function clone(s){return{p:s.p.slice(),bar:{...s.bar},off:{...s.off}}}
const sgn=c=>c==='w'?1:-1, opp=c=>c==='w'?'b':'w';
function mine(s,c,i){return s.p[i]*sgn(c)>0}
function allHome(s,c){if(s.bar[c])return false;for(let i=0;i<24;i++){if(mine(s,c,i)&&(c==='w'?i>5:i<18))return false}return true}
function openTo(s,c,i){return s.p[i]*sgn(c)>=-1}
function singleMoves(s,c,d){const r=[];
 if(s.bar[c]){const t=c==='w'?24-d:d-1;if(openTo(s,c,t))r.push({from:'bar',to:t,die:d});return r}
 const home=allHome(s,c);
 for(let i=0;i<24;i++){if(!mine(s,c,i))continue;const t=c==='w'?i-d:i+d;
  if(t>=0&&t<24){if(openTo(s,c,t))r.push({from:i,to:t,die:d})}
  else if(home){const exact=c==='w'?t===-1:t===24;let ok=exact;
   if(!exact){ok=true;if(c==='w'){for(let j=i+1;j<=5;j++)if(mine(s,c,j))ok=false}else{for(let j=18;j<i;j++)if(mine(s,c,j))ok=false}}
   if(ok)r.push({from:i,to:OFF,die:d})}}
 return r}
function applyMove(s,c,m){const n=clone(s),g=sgn(c);
 if(m.from==='bar')n.bar[c]--;else n.p[m.from]-=g;
 if(m.to===OFF)n.off[c]++;else{if(n.p[m.to]===-g){n.p[m.to]=0;n.bar[opp(c)]++}n.p[m.to]+=g}
 return n}
function key(s){return s.p.join(',')+'|'+s.bar.w+s.bar.b+'|'+s.off.w+','+s.off.b}
// all maximal sequences, with larger-die rule
function sequences(s,c,dice){const out=[];let max=0;const seen=new Set();
 (function rec(st,rem,seq){let any=false;const tried=new Set();
  for(let k=0;k<rem.length;k++){const d=rem[k];if(tried.has(d))continue;tried.add(d);
   const rest=rem.slice(0,k).concat(rem.slice(k+1));
   for(const m of singleMoves(st,c,d)){any=true;const ns=applyMove(st,c,m);const kk=key(ns)+'#'+rest.join('')+'#'+seq.length;
    if(seen.has(kk)&&seq.length>0){/* identical continuation; still record via first path */continue}seen.add(kk);
    rec(ns,rest,seq.concat([m]))}}
  if(!any){max=Math.max(max,seq.length);out.push({seq,state:st})}})(s,dice,[]);
 let res=out.filter(o=>o.seq.length===max);
 if(max===1&&dice.length===2&&dice[0]!==dice[1]){const big=Math.max(...dice);if(res.some(o=>o.seq[0].die===big))res=res.filter(o=>o.seq[0].die===big)}
 return res}
function maxDepth(s,c,rem,memo){if(!rem.length)return 0;const k=key(s)+'#'+rem.slice().sort().join('');if(memo.has(k))return memo.get(k);let best=0;const tried=new Set();
 for(let i=0;i<rem.length&&best<rem.length;i++){const d=rem[i];if(tried.has(d))continue;tried.add(d);const rest=rem.slice(0,i).concat(rem.slice(i+1));
  for(const m of singleMoves(s,c,d)){const v=1+maxDepth(applyMove(s,c,m),c,rest,memo);if(v>best)best=v;if(best===rem.length)break}}
 memo.set(k,best);return best}
function legalMoves(s,c,dice){const memo=new Map();const total=maxDepth(s,c,dice,memo);if(!total)return[];let out=[];const tried=new Set();
 for(let i=0;i<dice.length;i++){const d=dice[i];if(tried.has(d))continue;tried.add(d);const rest=dice.slice(0,i).concat(dice.slice(i+1));
  for(const m of singleMoves(s,c,d))if(1+maxDepth(applyMove(s,c,m),c,rest,memo)===total)out.push(m)}
 if(total===1&&dice.length===2&&dice[0]!==dice[1]){const big=Math.max(...dice);if(out.some(m=>m.die===big))out=out.filter(m=>m.die===big)}
 return out}
function diceList(a,b){return a===b?[a,a,a,a]:[a,b]}
function pip(s,c){let t=s.bar[c]*25;for(let i=0;i<24;i++)if(mine(s,c,i))t+=Math.abs(s.p[i])*(c==='w'?i+1:24-i);return t}
function winner(s){return s.off.w===15?'w':s.off.b===15?'b':null}
function evaluate(s,c){const o=opp(c),g=sgn(c);let sc=(pip(s,o)-pip(s,c))+s.off[c]*4;
 // contact check
 let myBack=c==='w'?-1:24,oppBack=c==='w'?24:-1;
 for(let i=0;i<24;i++){if(mine(s,c,i)){myBack=c==='w'?Math.max(myBack,i):Math.min(myBack,i)}if(mine(s,o,i)){oppBack=c==='w'?Math.min(oppBack,i):Math.max(oppBack,i)}}
 if(s.bar[c])myBack=c==='w'?24:-1;if(s.bar[o])oppBack=c==='w'?-1:24;
 const contact=c==='w'?myBack>oppBack:myBack<oppBack;
 if(!contact)return sc*2+s.off[c]*10;
 sc+=s.bar[o]*12-s.bar[c]*12;
 for(let i=0;i<24;i++){const n=s.p[i]*g;if(n>=2){const homeP=c==='w'?i<=5:i>=18;sc+=homeP?6:3;if(i>0&&s.p[i-1]*g>=2)sc+=2}
  else if(n===1){let thr=s.bar[o]?3:0;for(let j=0;j<24;j++){if(!mine(s,o,j))continue;const dist=c==='w'?i-j:j-i;if(dist>0&&dist<=12)thr+=dist<=6?2:1}
   const homeP=c==='w'?i<=5:i>=18;sc-=thr?4+thr*1.5+(homeP?0:2)*0:0;}}
 return sc}
function aiChoose(s,c,dice){const seqs=sequences(s,c,dice);let best=null,bv=-1e9;for(const o of seqs){const v=evaluate(o.state,c)+Math.random()*0.01;if(v>bv){bv=v;best=o}}return best?best.seq:[]}
function randomChoose(s,c,dice){const ss=sequences(s,c,dice);return ss.length?ss[Math.floor(Math.random()*ss.length)].seq:[]}
const ROLLS=[];for(let a=1;a<=6;a++)for(let b=a;b<=6;b++)ROLLS.push([a,b,a===b?1:2]);
function hardChoose(s,c,dice,budget){const now=()=>(typeof performance!=='undefined'?performance.now():Date.now());const dl=now()+(budget||900);const seqs=sequences(s,c,dice);if(seqs.length<=1)return seqs.length?seqs[0].seq:[];
 const o=opp(c);const uniq=new Map();for(const x of seqs){const k=key(x.state);if(!uniq.has(k))uniq.set(k,x)}
 let cand=[...uniq.values()].map(x=>({x,v:evaluate(x.state,c)}));cand.sort((a,b)=>b.v-a.v);cand=cand.slice(0,10);
 let best=cand[0].x,bv=-1e9;
 for(const {x} of cand){if(winner(x.state)===c)return x.seq;if(now()>dl)break;let tot=0,cut=false;
  for(const [a,b,w] of ROLLS){if(now()>dl){cut=true;break}const rs=sequences(x.state,o,diceList(a,b));let ov=-1e9;
   for(const r of rs){const v=winner(r.state)===o?1e6:evaluate(r.state,o);if(v>ov)ov=v}tot+=w*ov}
  if(cut)break;const v=-tot/36+Math.random()*0.01;if(v>bv){bv=v;best=x}}
 return best.seq}
function chooseByLevel(lv,s,c,dice,budget){return lv==='easy'?randomChoose(s,c,dice):lv==='hard'?hardChoose(s,c,dice,budget):aiChoose(s,c,dice)}
function validState(s){if(!s||!Array.isArray(s.p)||s.p.length!==24||!s.bar||!s.off||s.p.some(x=>!Number.isInteger(x)))return false;let w=s.bar.w+s.off.w,b=s.bar.b+s.off.b;for(const x of s.p){if(x>0)w+=x;else b-=x}return w===15&&b===15&&s.bar.w>=0&&s.bar.b>=0}
if(typeof module!=='undefined')module.exports={maxDepth,randomChoose,hardChoose,chooseByLevel,newGame,singleMoves,applyMove,sequences,legalMoves,diceList,aiChoose,winner,validState,allHome,pip,OFF};
// ENGINE END
</script>
<script>
const svg=document.getElementById('board'),NS='http://www.w3.org/2000/svg';
let G,turn,dice,rem,hist,sel,rolled,busy;
const $=id=>document.getElementById(id);
const twoP=()=>$('level').value==='2p';const human=c=>c==='w'||twoP();
const name=c=>twoP()?(c==='w'?'White':'Black'):(c==='w'?'You':'Computer');
let ROOT;function el(t,a,p){p=p||ROOT||svg;const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(t==='text'&&innerHeight>innerWidth)e.setAttribute('transform',`rotate(-90 ${a.x} ${a.y})`);p.appendChild(e);return e}
// geometry
const L=40,BW=60,PW=60,TOP=20,BOT=620,H=250,OFFX=880;
function px(i){let col=i>=12?i-12:11-i;let x=L+col*PW+(col>=6?BW:0);return x+PW/2}
let aiTimer=null,autoTimer=null,busySince=0,worker=null,aiReq=0;
function clearTimers(){clearTimeout(aiTimer);clearTimeout(autoTimer);aiTimer=autoTimer=null}
function setBusy(v){busy=v;busySince=v?Date.now():0;$('thinking').style.visibility=v&&!human(turn)?'visible':'hidden'}
function start(){clearTimers();aiReq++;G=newGame();turn='w';dice=[];rem=[];hist=[];sel=null;rolled=false;setBusy(false);$('over').style.display='none';setStatus(name('w')+': roll the dice.');render();}
function setStatus(t){$('status').textContent=t}
function moves(){return rolled?legalMoves(G,turn,rem):[]}
// when the human has nothing left to play, pass automatically (Undo cancels)
function checkAutoPass(){clearTimeout(autoTimer);autoTimer=null;if(!human(turn)||!rolled||busy||winner(G))return;if(moves().length)return;
 const left=rem.length;setStatus((left?'No legal move for the '+(left>1?'remaining dice':rem[0])+'. ':'Turn complete. ')+(hist.length?'Passing in 2s… (tap Undo to change)':'Passing turn…'));
 autoTimer=setTimeout(()=>{autoTimer=null;if(human(turn)&&rolled&&!busy&&!moves().length)endTurn()},hist.length?2000:1800)}
function roll(){if(arguments[0]!=='ai'&&(rolled||busy||!human(turn)))return;const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);dice=[a,b];rem=diceList(a,b);rolled=true;hist=[];sel=null;
 const any=moves().length;
 setStatus(name(turn)+' rolled '+a+'-'+b+(any?((a===b?' (doubles: 4 moves)':'')+'. '+(human(turn)?(G.bar[turn]?'Enter from the bar: tap a green point.':'Tap a checker, then tap where to move it.'):'')):' — no legal moves.'));
 render();if(human(turn)&&!any){clearTimeout(autoTimer);autoTimer=setTimeout(()=>{autoTimer=null;if(human(turn)&&rolled&&!moves().length)endTurn()},1800)}
 return any}
function doMove(m){hist.push({G,rem:rem.slice()});G=applyMove(G,turn,m);rem.splice(rem.indexOf(m.die),1);sel=null;
 const w=winner(G);if(w){render();gameOver(w);return}
 if(human(turn)){const ms=moves();if(ms.length)setStatus(rem.length+' move(s) left: '+rem.join(', '))}
 render();if(human(turn))checkAutoPass()}
function endTurn(){clearTimers();if(winner(G))return;turn=opp(turn);rolled=false;dice=[];rem=[];hist=[];sel=null;
 if(human(turn)){setBusy(false);setStatus(name(turn)+': roll the dice.');render()}else{setBusy(true);setStatus('Computer is thinking…');render();aiTimer=setTimeout(aiTurn,600)}}
function getWorker(){if(worker!==null)return worker;try{const src=document.getElementById('engine').textContent+'\nonmessage=e=>{const d=e.data;let seq=[];try{seq=chooseByLevel(d.lv,d.G,d.c,d.rem,d.budget)}catch(x){}postMessage({id:d.id,seq})}';
 worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));worker.onerror=()=>{worker=false}}catch(e){worker=false}return worker}
function computeAI(lv,cb){const id=++aiReq;const budget=900;const w=getWorker();let done=false;
 const finish=seq=>{if(done||id!==aiReq)return;done=true;cb(seq)};
 const fallback=()=>{if(done)return;finish(chooseByLevel(lv==='hard'?'medium':lv,G,turn,rem))};
 if(w){const h=e=>{if(e.data.id===id){w.removeEventListener('message',h);finish(e.data.seq)}};w.addEventListener('message',h);w.postMessage({id,lv,G,c:turn,rem,budget});setTimeout(fallback,4000)}
 else setTimeout(()=>finish(chooseByLevel(lv,G,turn,rem,budget)),30)}
function aiTurn(){aiTimer=null;if(human(turn)||winner(G)){setBusy(false);render();return}setBusy(true);
 if(!rolled)roll('ai');
 if(!moves().length){aiTimer=setTimeout(endTurn,1200);return}
 setStatus('Computer rolled '+dice.join('-')+' — thinking…');
 computeAI($('level').value,seq=>{
  // validate move list; fall back to a legal sequence if anything is off
  let k=0;(function step(){if(human(turn)||winner(G))return;const ms=moves();if(!ms.length){aiTimer=setTimeout(endTurn,500);return}
   let m=seq&&seq[k]&&ms.find(x=>x.from===seq[k].from&&x.to===seq[k].to&&x.die===seq[k].die);if(!m){m=ms[0];seq=null}k++;
   doMove(m);if(winner(G))return;aiTimer=setTimeout(step,500)})()})}
function gameOver(w){clearTimers();setBusy(false);$('overMsg').textContent=twoP()?(name(w)+' wins!'):(w==='w'?'You win! 🎉':'Computer wins');$('over').style.display='flex';setStatus('Game over.');render()}
function srcs(ms){return [...new Set(ms.map(m=>m.from))]}
function clickSrc(src){if(!human(turn)||!rolled||busy||winner(G))return;const ms=moves();
 if(sel!==null){const m=ms.find(m=>m.from===sel&&m.to===src);if(m){doMove(m);return}}
 if(ms.some(m=>m.from===src)){sel=(sel===src&&srcs(ms).length>1?null:src)}
 else{const to=ms.filter(m=>m.to===src),fr=srcs(to);
  if(fr.length===1){doMove(to[0]);return}
  sel=null;if(ms.length)setStatus((G.bar[turn]?'Enter from the bar first: tap the bar, then a green point. ':'That checker can\'t move. ')+rem.length+' move(s) left: '+rem.join(', '))}render()}
function save(){try{localStorage.setItem('bg_level',$('level').value);if(human(turn)||winner(G))localStorage.setItem('bg_game',JSON.stringify({G,turn,dice,rem,rolled}));else localStorage.setItem('bg_game',JSON.stringify({G:hist.length?hist[0].G:G,turn,dice:[],rem:[],rolled:false}))}catch(e){}}
function render(){save();svg.innerHTML='';const PORT=innerHeight>innerWidth;svg.setAttribute('viewBox',PORT?'0 0 640 960':'0 0 960 640');ROOT=document.createElementNS(NS,'g');if(PORT)ROOT.setAttribute('transform','translate(640,0) rotate(90)');svg.appendChild(ROOT);el('rect',{x:0,y:0,width:960,height:640,fill:'#5a3a22',rx:12});
 el('rect',{x:L,y:TOP,width:PW*6,height:600,fill:'#e8d3a6'});el('rect',{x:L+PW*6+BW,y:TOP,width:PW*6,height:600,fill:'#e8d3a6'});
 el('rect',{x:L+PW*6,y:TOP,width:BW,height:600,fill:'#3d2616'});el('rect',{x:OFFX-20,y:TOP,width:70,height:600,fill:'#3d2616',rx:6});
 const ms=moves();if(human(turn)&&ms.length&&sel===null){const S=srcs(ms);if(S.length===1)sel=S[0]}if(sel!==null&&!ms.some(m=>m.from===sel))sel=null;const dest=sel!==null?ms.filter(m=>m.from===sel).map(m=>m.to):[];
 for(let i=0;i<24;i++){const x=px(i),top=i>=12;const tri=el('polygon',{'pointer-events':'none',points:top?`${x-PW/2},${TOP} ${x+PW/2},${TOP} ${x},${TOP+H}`:`${x-PW/2},${BOT} ${x+PW/2},${BOT} ${x},${BOT-H}`,fill:i%2?'#8c2f1b':'#2f4a5c'});
  const hit=el('rect',{x:x-PW/2,y:top?TOP:BOT-300,width:PW,height:300,fill:'transparent',style:'cursor:pointer'});hit.dataset.src=i;
  el('text',{'pointer-events':'none',x,y:top?13:636,fill:'#e8d3a6','font-size':11,'text-anchor':'middle'}).textContent=i+1;
  if(dest.includes(i))el('polygon',{points:tri.getAttribute('points'),class:'hl'});
  const n=Math.abs(G.p[i]),c=G.p[i]>0?'w':'b';for(let k=0;k<Math.min(n,5);k++){const cy=top?TOP+27+k*52:BOT-27-k*52;chk(x,cy,c,i,sel===i&&k===Math.min(n,5)-1,k===4&&n>5?n:0)}}
 // bar (whole strip tappable)
 const bx=L+PW*6+BW/2;{const bh=el('rect',{x:L+PW*6,y:TOP,width:BW,height:600,fill:sel==='bar'?'#4cff7a55':'transparent',style:'cursor:pointer'});bh.dataset.src='bar'}['w','b'].forEach(c=>{const n=G.bar[c];for(let k=0;k<Math.min(n,4);k++){const cy=c==='w'?TOP+200-k*50:BOT-200+k*50;chk(bx,cy,c,'bar',c===turn&&sel==='bar'&&k===0,k===3&&n>4?n:0)}});
 // off trays
 ['w','b'].forEach(c=>{const n=G.off[c];const y0=c==='w'?BOT-8:TOP+8;for(let k=0;k<n;k++)el('rect',{'pointer-events':'none',x:OFFX-12,y:c==='w'?y0-(k+1)*15:y0+k*15,width:54,height:12,rx:3,fill:c==='w'?'#f7f3ea':'#1b1b1b',stroke:'#888'});
  el('text',{'pointer-events':'none',x:OFFX+15,y:c==='w'?BOT-250:TOP+262,fill:'#e8d3a6','font-size':13,'text-anchor':'middle'}).textContent=(c==='w'?'White':'Black')+' off: '+n});
 {const r=el('rect',{x:OFFX-20,y:TOP,width:70,height:600,rx:6,fill:dest.includes(OFF)?'#4cff7a':'transparent',opacity:dest.includes(OFF)?.55:1});r.style.cursor='pointer';r.dataset.src=OFF}
 // dice
 const used=dice.length?(dice[0]===dice[1]?4-rem.length:2-rem.length):0;
 const shown=dice.length?(dice[0]===dice[1]?[dice[0],dice[0],dice[0],dice[0]]:dice):[];
